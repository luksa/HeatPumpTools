<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domestic Hot Water Tank Size Calculator</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .result-card {
            min-height: 200px;
        }
        @media (max-width: 767.98px) {
            .result-card {
                min-height: auto;
            }
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="text-center mb-5">Hot Water Tank Size Calculator</h1>

        <div class="row g-5">
            <!-- Left column: inputs -->
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="calculatorForm">
                            <!-- Showers -->
                            <div class="row mb-3 align-items-center">
                                <label for="showers" class="col-sm-7 col-form-label">Showers per day</label>
                                <div class="col-sm-5">
                                    <input type="number" class="form-control form-control-lg" id="showers" min="0" value="2" required>
                                </div>
                            </div>
                            <!-- Baths -->
                            <div class="row mb-3 align-items-center">
                                <label for="baths" class="col-sm-7 col-form-label">Baths per day</label>
                                <div class="col-sm-5">
                                    <input type="number" class="form-control form-control-lg" id="baths" min="0" value="1" required>
                                </div>
                            </div>
                            <!-- Sinks -->
                            <div class="row mb-3 align-items-center">
                                <label for="sinks" class="col-sm-7 col-form-label">Kitchen sink uses per day (approx.)</label>
                                <div class="col-sm-5">
                                    <input type="number" class="form-control form-control-lg" id="sinks" min="0" value="4" required>
                                </div>
                            </div>
                            <!-- Tank temperature FIRST -->
                            <div class="row mb-3 align-items-center">
                                <label for="tankTemp" class="col-sm-7 col-form-label">Desired tank temperature (°C)</label>
                                <div class="col-sm-5">
                                    <input type="number" class="form-control form-control-lg" id="tankTemp" value="50" step="0.1" required>
                                </div>
                            </div>
                            <!-- Cold water temperature SECOND -->
                            <div class="row mb-3 align-items-center">
                                <label for="coldTemp" class="col-sm-7 col-form-label">Cold water temperature (°C)</label>
                                <div class="col-sm-5">
                                    <input type="number" class="form-control form-control-lg" id="coldTemp" value="10" step="0.1" required>
                                </div>
                            </div>
                        </form>

                        <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Calculate Tank Size</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right column: results -->
            <div class="col-lg-6">
                <div id="results" class="card shadow result-card">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <h3 class="card-title text-center mb-4">Results</h3>
                        <div class="text-center">
                            <p class="fs-5 mb-3">
                                <strong>Equivalent hot water at 40°C:</strong><br>
                                <span id="equivVolume" class="fs-1 fw-bold text-primary">390.0</span> L
                            </p>
                            <hr class="my-4">
                            <p class="fs-5">
                                <strong>Required tank volume:</strong><br>
                                <span id="tankVolume" class="fs-1 fw-bold text-success">292.5</span> L
                            </p>
                        </div>
                        <small class="text-muted mt-4 text-center">
                            Based on: showers × 100 L + baths × 150 L + sinks × 10 L at 40°C
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // Elements
        const inputs = [
            document.getElementById('showers'),
            document.getElementById('baths'),
            document.getElementById('sinks'),
            document.getElementById('coldTemp'),
            document.getElementById('tankTemp')
        ];

        const equivVolumeEl = document.getElementById('equivVolume');
        const tankVolumeEl  = document.getElementById('tankVolume');
        const resultsCard   = document.getElementById('results');

        // Calculate function
        function calculate() {
            const showers = parseFloat(document.getElementById('showers').value) || 0;
            const baths   = parseFloat(document.getElementById('baths').value)   || 0;
            const sinks   = parseFloat(document.getElementById('sinks').value)   || 0;
            const T1      = parseFloat(document.getElementById('coldTemp').value) || 10;
            const T2      = parseFloat(document.getElementById('tankTemp').value) || 50;

            // Equivalent volume at 40°C (V2)
            const V2 = (showers * 100) + (baths * 150) + (sinks * 10);

            let V1 = 0;
            let isValid = true;

            // Temperature validation
            if (isNaN(T1) || isNaN(T2) || T1 >= T2 || T1 >= 40 || T2 <= 40) {
                isValid = false;
            } else {
                V1 = V2 * (40 - T1) / (T2 - T1);
            }

            // Update display
            equivVolumeEl.textContent = V2.toFixed(0);

            if (isValid) {
                tankVolumeEl.textContent = V1.toFixed(0);
                tankVolumeEl.classList.remove('text-danger');
                tankVolumeEl.classList.add('text-success');
            } else {
                tankVolumeEl.textContent = 'Invalid temps';
                tankVolumeEl.classList.remove('text-success');
                tankVolumeEl.classList.add('text-danger');
            }

            resultsCard.classList.remove('d-none');
        }

        // Attach live listeners
        inputs.forEach(input => {
            input.addEventListener('input', calculate);
            input.addEventListener('change', calculate);
        });

        // Initial calculation
        calculate();
    </script>
</body>
</html>
